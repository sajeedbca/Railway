services:
  - type: web
    name: railway-reservation-django
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn RailwayDjango.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
